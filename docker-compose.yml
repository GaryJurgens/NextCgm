services:
  nginx-ui:
    image: uozi/nginx-ui:latest
    container_name: nginx-ui
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000" # Management UI Port
    volumes:
      # Map host directories for Nginx configs and UI database
      - ./nginx_data/nginx:/etc/nginx
      - ./nginx_data/nginx-ui:/etc/nginx-ui
      # Mount the Docker socket so Nginx UI can interact with Docker
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NGINX_UI_OFFICIAL_DOCKER=true
      - NGINX_UI_URL=http://102.214.9.167:9000/
    restart: always
    networks:
      - nextcgm_network

  nextcgm-backend:
   
    image: gary450450/nextcgm-backend:latest
    container_name: nextcgm-backend
    user: root
    # Exposing 8080 to the host allows you to test the API via IP if Nginx fails
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx_data/nginx:/app/nginx_data/nginx
      - ./nginx_data/nginx-ui:/app/nginx_data/nginx-ui
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DockerSettings__IsLocalDevelopment=false
      - DockerSettings__DockerNetworkName=nextcgm_network
    restart: always
    networks:
      - nextcgm_network

networks:
  nextcgm_network:
    name: nextcgm_network
    driver: bridge